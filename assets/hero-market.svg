<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 760" role="img" aria-labelledby="title desc"><title id="title">Fresh market shopping bag</title><desc id="desc">Illustration of a forest green grocery bag with fruit, vegetables and bread</desc>
<defs>
 <radialGradient id="bg"><stop stop-color="#eff1ca"/><stop offset="1" stop-color="#b4d8ad"/></radialGradient>
 <linearGradient id="bag" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#356b50"/><stop offset=".56" stop-color="#214c39"/><stop offset="1" stop-color="#143d31"/></linearGradient>
 <linearGradient id="bread" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7d08a"/><stop offset="1" stop-color="#c98949"/></linearGradient>
 <linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fdac5c"/><stop offset="1" stop-color="#eb692f"/></linearGradient>
 <linearGradient id="tomato" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9774"/><stop offset="1" stop-color="#e94731"/></linearGradient>
 <filter id="shadow" x="-40%" width="180%" y="-40%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#285440" flood-opacity=".28"/></filter>
 <filter id="smallshadow" x="-30%" width="160%" y="-30%" height="160%"><feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#365541" flood-opacity=".2"/></filter>
</defs>
<circle cx="381" cy="373" r="298" fill="url(#bg)" opacity=".72"/>
