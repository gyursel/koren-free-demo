# Password-protected TEST demo; no paid resources and NO persistent storage.
# Edits, stock changes and sample orders disappear on restarts/deploys/idle spin-down.
services:
  - type: web
    name: koren-free-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: KOREN_DATA_DIR
        value: /tmp/koren-demo-data
      - key: KOREN_STAGING_ONLY
        value: '1'
      - key: STAGING_HTTP_USER
        sync: false
      - key: STAGING_HTTP_PASSWORD
        sync: false
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECRET
        generateValue: true
